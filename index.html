<!doctype html>
<html lang="ro">
  <head>
    <!-- Build: 2025-10-12-v3 -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMP - Asura Management Platform</title>
    <style>

      #root:empty::before {
        content: "Se încarcă aplicația...";
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: system-ui, sans-serif;
        font-size: 1.25rem;
        color: #666;
      }
      
      /* Basic loading spinner */
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      
      .fallback-loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #f97316;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
        display: none;
      }
      
      #root:empty + .fallback-loader {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="fallback-loader"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>

      setTimeout(() => {
        const root = document.getElementById('root');
        if (!root.childElementCount) {
          root.innerHTML = `
            <div class="flex flex-col items-center justify-center h-screen">
              <h1 class="text-xl font-bold mb-4">Aplicația nu s-a putut încărca</h1>
              <p class="text-red-600 mb-4">Aplicația nu a putut fi inițializată. Acest lucru ar putea fi din cauza:</p>
              <ul class="list-disc pl-5 mb-4">
                <li>Serviciul de autentificare (Keycloak) nu rulează</li>
                <li>Erori JavaScript în timpul inițializării</li>
                <li>Probleme de conectivitate la rețea</li>
              </ul>
              <button onclick="window.location.reload()" class="px-4 py-2 bg-orange-500 text-white rounded hover:bg-orange-600">
                Reîncarcă aplicația
              </button>
            </div>
          `;
        }
      }, 5000);
    </script>
  </body>
</html>
